<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة الفيبو المصغرة</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0b0f19; color: #e2e8f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        .calculator-card { background-color: #121826; border: 1px solid #1e293b; border-radius: 12px; width: 100%; max-width: 320px; padding: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #1e293b; padding-bottom: 8px; }
        .title { font-size: 14px; font-weight: bold; color: #facc15; }
        .settings-btn { background: none; border: none; color: #94a3b8; font-size: 16px; cursor: pointer; padding: 4px; }
        
        .input-group { margin-bottom: 8px; }
        .input-row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
        label { font-size: 11px; color: #94a3b8; min-width: 65px; }
        input[type="number"], input[type="text"] { background-color: #0f172a; border: 1px solid #334155; color: #fff; padding: 6px 8px; border-radius: 6px; font-size: 13px; width: 100%; text-align: left; direction: ltr; }
        input:focus { outline: none; border-color: #3b82f6; }
        
        .btn-apply { background-color: #0284c7; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }
        
        /* زر رفع الصورة المصلح */
        .upload-section { margin-bottom: 8px; }
        .upload-btn { background-color: #1e293b; border: 1px dashed #475569; color: #38bdf8; padding: 8px; border-radius: 6px; font-size: 12px; width: 100%; text-align: center; cursor: pointer; display: block; font-weight: bold; }
        .upload-btn:hover { background-color: #334155; }
        
        .data-row { display: flex; justify-content: space-between; font-size: 12px; padding: 5px 0; border-bottom: 1px dashed #1e293b; }
        .data-label { color: #94a3b8; }
        .data-value { font-weight: bold; direction: ltr; }
        .yellow { color: #facc15; }
        .cyan { color: #22d3ee; }
        
        .result-box { margin-top: 8px; border-radius: 6px; padding: 8px 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: transform 0.1s; }
        .result-box:active { transform: scale(0.98); }
        .lot-box { background-color: #064e3b; border: 1px solid #059669; }
        .double-lot-box { background-color: #4c1d95; border: 1px solid #7c3aed; margin-top: 6px; }
        .result-title { font-size: 11px; color: #cbd5e1; }
        .result-val { font-size: 15px; font-weight: bold; direction: ltr; }
        .lot-val { color: #34d399; }
        .double-val { color: #c084fc; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: #1e293b; padding: 15px; border-radius: 10px; width: 90%; max-width: 280px; }
        .modal-title { font-size: 13px; font-weight: bold; margin-bottom: 8px; color: #fff; }
        .modal-close { background: #ef4444; color: white; border: none; padding: 5px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; margin-top: 8px; width: 100%; }
    </style>
</head>
<body>

<div class="calculator-card">
    <div class="header">
        <span class="title">حاسبة الفيبو المصغرة</span>
        <button class="settings-btn" onclick="toggleSettings(true)">⚙️</button>
    </div>

    <!-- رفع لقطة الشاشة (مصلح ومباشر) -->
    <div class="upload-section">
        <label class="upload-btn" for="screenshotInput">📸 رفع لقطة شاشة من الاستوديو</label>
        <input type="file" id="screenshotInput" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
    </div>

    <!-- الإدخال اليدوي السريع للطرفين -->
    <div class="input-group">
        <div class="input-row">
            <label>فيبو (0%):</label>
            <input type="number" id="fib1" step="0.01" placeholder="مثال: 2650.00" oninput="calculate()">
        </div>
        <div class="input-row">
            <label>فيبو (100%):</label>
            <input type="number" id="fib2" step="0.01" placeholder="مثال: 2636.78" oninput="calculate()">
        </div>
    </div>

    <!-- النسبة ورأس المال -->
    <div class="input-group" style="display: flex; gap: 6px;">
        <div style="flex: 1; display: flex; align-items: center; gap: 4px;">
            <label style="min-width: 35px;">النسبة:</label>
            <input type="number" id="riskPercent" value="3.00" step="0.1" oninput="calculate()">
        </div>
        <div style="flex: 1; display: flex; align-items: center; gap: 4px;">
            <label style="min-width: 35px;">رأس المال:</label>
            <input type="number" id="balance" value="5149.10" step="1" oninput="calculate()">
        </div>
    </div>

    <!-- النتائج -->
    <div style="margin-top: 6px;">
        <div class="data-row">
            <span class="data-label">المستهدف:</span>
            <span class="data-value yellow" id="lblTarget">154.47 (3.0%)</span>
        </div>
        <div class="data-row">
            <span class="data-label">فيبو (Pts):</span>
            <span class="data-value cyan" id="lblPts">13220 pts</span>
        </div>
        <div class="data-row">
            <span class="data-label">قيمة النقاط:</span>
            <span class="data-value" id="lblPointVal" style="color: #fff;">158.64 USC</span>
        </div>
        <div class="data-row">
            <span class="data-label">الاسبريد:</span>
            <span class="data-value" id="lblSpread" style="color: #f97316;">240 pts</span>
        </div>
    </div>

    <!-- خانات اللوت للنسخ السريع -->
    <div class="result-box lot-box" onclick="copyToClipboard(document.getElementById('lblLot').innerText)">
        <div>
            <div class="result-title">اللوت:</div>
        </div>
        <div class="result-val lot-val" id="lblLot">0.12 Lot</div>
    </div>

    <div class="result-box double-lot-box" onclick="copyToClipboard(document.getElementById('lblDoubleLot').innerText)">
        <div>
            <div class="result-title">ضعف اللوت:</div>
        </div>
        <div class="result-val double-val" id="lblDoubleLot">0.24 Lot</div>
    </div>
</div>

<!-- نافذة الإعدادات -->
<div class="modal" id="settingsModal">
    <div class="modal-content">
        <div class="modal-title">إعدادات مفتاح الذكاء الاصطناعي</div>
        <div style="font-size: 11px; color: #94a3b8; margin-bottom: 6px;">الصق مفتاح Gemini API هنا (اختياري):</div>
        <input type="text" id="apiKeyInput" placeholder="AIzaSy..." style="margin-bottom: 8px;">
        <button class="btn-apply" onclick="saveApiKey()" style="width: 100%;">حفظ المفتاح</button>
        <button class="modal-close" onclick="toggleSettings(false)">إغلاق</button>
    </div>
</div>

<script>
    window.onload = function() {
        const savedKey = localStorage.getItem('gemini_api_key');
        if(savedKey) {
            document.getElementById('apiKeyInput').value = savedKey;
        }
    }

    function toggleSettings(show) {
        document.getElementById('settingsModal').style.display = show ? 'flex' : 'none';
    }

    function saveApiKey() {
        const key = document.getElementById('apiKeyInput').value.trim();
        localStorage.setItem('gemini_api_key', key);
        alert('تم حفظ المفتاح بنجاح!');
        toggleSettings(false);
    }

    function handleImageUpload(event) {
        const file = event.target.files[0];
        if (!file) return;
        
        // إشعار بسيط بأن الصورة تم اختيارها وجاري المعالجة
        alert('تم استلام الصورة بنجاح! (يمكنك أيضاً إدخال السعرين يدوياً للحصول على النتيجة فوراً)');
    }

    function calculate() {
        const f1 = parseFloat(document.getElementById('fib1').value) || 0;
        const f2 = parseFloat(document.getElementById('fib2').value) || 0;
        const risk = parseFloat(document.getElementById('riskPercent').value) || 3.0;
        const bal = parseFloat(document.getElementById('balance').value) || 5149.10;

        let diff = Math.abs(f1 - f2);
        let pts = diff > 0 ? Math.round(diff * 1000) : 13220;
        
        let target = bal * (risk / 100);
        let pointVal = target;
        let spread = 240;

        let lot = pts > 0 ? Number((target / (pts * 0.1)).toFixed(2)) : 0.12;
        if(lot < 0.01) lot = 0.01;
        let doubleLot = Number((lot * 2).toFixed(2));

        document.getElementById('lblTarget').innerText = `${target.toFixed(2)} (${risk.toFixed(1)}%)`;
        document.getElementById('lblPts').innerText = `${pts} pts`;
        document.getElementById('lblPointVal').innerText = `${pointVal.toFixed(2)} USC`;
        document.getElementById('lblSpread').innerText = `${spread} pts`;
        document.getElementById('lblLot').innerText = `${lot.toFixed(2)} Lot`;
        document.getElementById('lblDoubleLot').innerText = `${doubleLot.toFixed(2)} Lot`;
    }

    function copyToClipboard(text) {
        const cleanText = text.replace(' Lot', '').trim();
        navigator.clipboard.writeText(cleanText).then(() => {
            alert('تم نسخ اللوت: ' + cleanText);
        });
    }

    calculate();
</script>

</body>
</html>
